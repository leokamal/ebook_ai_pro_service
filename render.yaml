# Render blueprint for E-Book AI Pro (see docs/DEPLOYMENT.md).
# A persistent disk requires a paid instance. With EMBEDDING_PROVIDER=huggingface size for torch + the model (>= 2 GB RAM).
services:
  - type: web
    name: ebook-ai-service
    runtime: docker
    plan: standard            # check current plan sizes; measure memory before choosing a smaller one
    healthCheckPath: /health
    disk:
      name: ebook-ai-data
      mountPath: /data         # holds the Chroma index (and the model cache for the local provider)
      sizeGB: 5
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBEDDING_DIMENSION
        value: "768"
      - key: SUPABASE_STORAGE_BUCKET
        value: user-documents
      - key: CHROMA_PERSIST_DIRECTORY
        value: /data/chroma_pro
      - key: HF_HOME
        value: /data/hf
      - key: AUTH_ALLOWED_PROVIDERS
        value: google,facebook
      - key: WORKER_ENABLED
        value: "true"
      - key: JOB_RETENTION_DAYS
        value: "30"
